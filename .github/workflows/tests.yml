# The rig's unit tests, against tests/fake_dolphin.py. No disc, no Dolphin.
# GitHub-hosted runners only. Never add a self-hosted runner to a public repo.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.8 is the oldest Python that Dolphin's embedded interpreter may have.
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
